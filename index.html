<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prateek Enterprises — Bharat Gas Domestic &amp; Commercial LPG Distributor, Bengaluru</title>
    <meta
      name="description"
      content="Prateek Enterprises is an authorised Bharat Gas distributor in OMBR Layout, Banaswadi, Bengaluru — supplying domestic and commercial LPG cylinders to homes, kitchens, hospitals and corporate campuses across the city."
    />
    <!--
      Favicon: the Bharat Petroleum roundel, matching the badge in the header.
      Rasterised from public/images/bpcl-logo.svg (Wikimedia Commons,
      File:Bharat_Petroleum_logo.svg — PD/simple-geometry) onto a white square,
      since browser tab bars render on both light and dark chrome and the
      source SVG's margin is otherwise transparent.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Netlify Forms detection.
      Netlify scans the DEPLOYED HTML at build time to register forms. Because this is a
      Vite SPA, React-rendered forms are invisible to that scan — so each form is declared
      once here as a hidden static copy. The `name` and every input `name` must stay in
      sync with the React components:
        - "request-a-call"  -> src/components/RequestCallForm.tsx
        - "get-in-touch"    -> src/components/Footer.tsx
      Adding a field in React means adding it here too, or Netlify will drop it.
    -->
    <form name="request-a-call" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="zip" />
    </form>
    <form name="get-in-touch" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
